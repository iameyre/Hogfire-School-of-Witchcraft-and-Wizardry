<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>倫妃步輦・預覽 1127f</title>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#0a0612;color:#fff;font-family:'Noto Serif TC',serif;line-height:1.7;padding:0 0 60px}
.wrap{max-width:460px;margin:0 auto;padding:18px 14px}
h1{font:400 24px DotGothic16,sans-serif;letter-spacing:.2em;color:#ffe9a8;text-align:center;margin:10px 0 4px;text-shadow:0 3px 0 #b3182f}
.sub{text-align:center;font-size:13px;color:#cfd0ff;margin-bottom:14px}
.card{border:2px solid #ffe9a8;background:#140a2c;padding:12px;margin:14px 0;box-shadow:0 0 0 3px #b3182f}
.card h2{font:400 20px DotGothic16,sans-serif;letter-spacing:.15em;color:#ffe9a8;margin:0 0 6px}
.card canvas{display:block;width:100%;image-rendering:pixelated;background:#10202a;border:2px solid #ffffff33}
.card p{font-size:14px;margin:8px 0}
.tg{display:flex;gap:8px;margin:6px 0 10px}
.tg label{flex:1;border:2px solid #ffffff55;padding:10px 6px;text-align:center;font:400 17px DotGothic16,sans-serif;letter-spacing:.1em;cursor:pointer}
.tg input{display:none}
.tg label:has(input:checked){background:linear-gradient(180deg,#fff3d2,#d9ad5e);border-color:#6a4a1e;color:#4a2a10}
.opt{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.opt label{flex:1 1 40%;border:2px solid #ffffff55;padding:10px 8px;text-align:center;font:400 16px DotGothic16,sans-serif;letter-spacing:.1em;cursor:pointer}
.opt input{display:none}
.opt label:has(input:checked){background:linear-gradient(180deg,#fff3d2,#d9ad5e);border-color:#6a4a1e;color:#4a2a10}
.row{display:flex;gap:6px;align-items:flex-end;justify-content:center;margin-top:8px;background:#1a1030;padding:8px;border:1px solid #ffffff22}
.row canvas{width:auto!important;border:none;background:none}
.row span{font-size:12px;color:#cfd0ff;align-self:center}
textarea{width:100%;min-height:70px;background:#0a0618;color:#fff;border:2px solid #ffffff55;padding:8px;font:14px 'Noto Serif TC',serif}
button{width:100%;height:54px;margin-top:10px;border:3px solid #6a4a1e;outline:2px solid #ffe9a8;outline-offset:2px;background:linear-gradient(180deg,#fff3d2,#d9ad5e);color:#4a2a10;font:400 19px DotGothic16,sans-serif;letter-spacing:.3em;border-radius:0}
#out{font-size:13px;color:#6aff9a;margin-top:8px;white-space:pre-wrap}
</style>
</head>
<body>
<div class="wrap">
<h1>倫妃步輦</h1>
<div class="sub">第四版：沒有宮人、沒有宮女。轎子浮在仙氣上（霧氣、發光魔法陣、小光球），旁邊多一隻可愛精靈<br>手機、電腦都能開</div>

<div class="card"><h2>簾子（可以開關）</h2>
<div class="tg"><label><input type="radio" name="c" value="silk" checked><span>粉紅綢簾</span></label><label><input type="radio" name="c" value="bead"><span>珍珠簾</span></label></div>
<p style="margin:0;font-size:12px;color:#cfd0ff">遊戲裡會放在坐騎設定，隨時切換。</p></div>

<div class="card"><h2>前</h2><canvas id="vF" width="84" height="64"></canvas></div>
<div class="card"><h2>右</h2><canvas id="vR" width="84" height="64"></canvas></div>
<div class="card"><h2>左</h2><canvas id="vL" width="84" height="64"></canvas></div>

<div class="card"><h2>實際在地圖上的大小</h2>
<div class="row"><canvas id="sF" width="84" height="64" style="height:64px"></canvas><canvas id="sR" width="84" height="64" style="height:64px"></canvas><canvas id="sN" width="14" height="18" style="height:18px"></canvas></div>
<p style="font-size:12px;color:#cfd0ff;margin:6px 0 0">最右邊小小一個是一般的倫，拿來比大小。移速 ×1.4（掃帚 ×1.3）。</p></div>

<div class="card"><h2>你的選擇</h2>
<div class="opt">
<label><input type="radio" name="p" value="就這樣做"><span>就這樣做</span></label>
<label><input type="radio" name="p" value="還要改"><span>還要改</span></label>
</div>
<p style="font-size:13px;color:#cfd0ff">想改哪裡直接寫：</p>
<textarea id="note" placeholder="例如：精靈再可愛一點、霧氣再多一點、轎子再小一點"></textarea>
<button id="cp">複製結果</button>
<div id="out"></div></div>
</div>
<script>
const PAL={O:'#2a1620',H:'#3a2a30',h:'#6a4a52',S:'#ffe1d0',B:'#ff9aa8',E:'#2a1620',R:'#d8203c',r:'#8a1226',W:'#fff',K:'#2a1620',Q:'#ff3a5a'};
const SIDE=['....OOOOOO....','..OOHHHHHHOO..','.OQQHHHHHHHHO.','.OQQHHHHHHHHHO','OHHHHHHHHHHHHO','OHHHHHHHHHSSSO','OHHHHHHHHSSSSO','OHHHHHHHSSSESO','OHHHHHHHSSSESO','OHHHHHHHSSBSSO','.OHHHHHHHSSSO.','.OHHHHHHRRRRO.','.OHHHHHHRRSRO.','.OHHHHHHRRRRO.','..OHHHHHrrrrO.','...OHHHOrrrO..'];
const mkSide=()=>{const c=document.createElement('canvas');c.width=14;c.height=16;const x=c.getContext('2d');SIDE.forEach((r,j)=>{for(let i=0;i<14;i++){const ch=r[i];if(ch!=='.'){x.fillStyle=PAL[ch];x.fillRect(i,j,1,1)}}});return c};
const SD=mkSide();
const W=84,H=64,FY=60;
let CURT='silk';
const GOLD='#ffd37a',GDK='#b07a30';
function ctx(cv){const g=cv.getContext('2d');g.imageSmoothingEnabled=false;return g}
/* 一般的倫（正面，比大小用／轎子裡面用）*/
/* 倫坐在椅子上（側面朝右）：椅背、紅坐墊、扶手、腳踩腳踏 */
function seatSide(g,x,seat,bob){const R=(c,a,b,w,h)=>{g.fillStyle=c;g.fillRect(Math.round(x+a),Math.round(seat+b),w,h)};
 R('#5a2e12',-3,-17,3,17);R(GOLD,-3,-17,1,17);R('#7a4a22',-2,-16,1,14);          /* 椅背 */
 R('#1a1420',-1,-2,14,3);R('#b3182f',0,-2,12,2);R(GOLD,0,-1,12,1);R('#5a2e12',0,1,12,2);  /* 坐墊與椅座 */
 /* 身體（坐直）*/
 R('#1a1420',1,-12+bob,9,10);R('#d8203c',2,-11+bob,7,9);R('#fff',6,-11+bob,2,2);R('#8a1226',2,-4+bob,7,2);
 R('#d8203c',8,-4,6,3);R('#ffe1d0',13,-3,2,2);R('#1a1420',13,-1,4,2);R('#5a2e12',12,1,6,2);   /* 腿往前、腳踩腳踏 */
 /* 頭髮與臉 */
 R('#2a1620',-1,-23+bob,11,12);R('#3a2a30',0,-22+bob,9,11);R('#3a2a30',-2,-14+bob,3,9);R('#3a2a30',-1,-6+bob,3,3);
 R('#ffe1d0',5,-19+bob,5,6);R('#3a2a30',5,-20+bob,5,2);R('#2a1620',8,-17+bob,1,2);R('#ff9aa8',7,-14+bob,2,1);R('#ff3a5a',2,-20+bob,2,2);
 R('#ffe1d0',9,-9+bob,2,2);R('#5a2e12',8,-9,5,1)}                                     /* 手搭扶手 */
/* 倫坐在椅子上（正面）*/
function seatFront(g,x,seat,bob){const R=(c,a,b,w,h)=>{g.fillStyle=c;g.fillRect(Math.round(x+a),Math.round(seat+b),w,h)};
 R('#5a2e12',-2,-19,16,19);R(GOLD,-2,-19,16,1);R('#7a4a22',-1,-18,14,17);for(let i=0;i<14;i+=3)R('#5a2e12',-1+i,-18,1,17);   /* 椅背（格子）*/
 R('#5a2e12',-4,-8,3,9);R(GOLD,-4,-8,3,1);R('#5a2e12',13,-8,3,9);R(GOLD,13,-8,3,1);                                     /* 兩邊扶手 */
 R('#1a1420',0,-3,12,4);R('#b3182f',1,-3,10,3);R(GOLD,1,-1,10,1);
 lunFront(g,x,seat-14,bob);R('#1a1420',2,0+Math.round(seat-seat),0,0);
 R('#1a1420',2,1,3,2);R('#1a1420',7,1,3,2)}
function lunFront(g,x,y,bob=0){const R=(c,a,b,w,h)=>{g.fillStyle=c;g.fillRect(x+a,y+b+bob,w,h)};
 R('#2a1620',3,0,6,1);R('#3a2a30',2,1,8,2);R('#2a1620',1,1,1,8);R('#3a2a30',1,2,2,9);R('#3a2a30',9,2,2,9);R('#ff3a5a',2,2,2,2);
 R('#ffe1d0',3,3,6,5);R('#3a2a30',3,3,3,1);R('#3a2a30',6,3,3,1);R('#2a1620',4,5,1,2);R('#2a1620',7,5,1,2);R('#ff9aa8',3,7,1,1);R('#ff9aa8',8,7,1,1);
 R('#d8203c',3,8,6,6);R('#fff',5,8,2,1);R('#8a1226',3,13,6,1)}
/* ===== 仙氣驅動：沒有宮人，轎子浮在霧氣上，下面有發光的魔法陣，幾顆小光球繞著轎子飄；旁邊是可愛精靈 ===== */
const ellp=(g,x,y,rx,ry,col)=>{g.fillStyle=col;for(let j=-ry;j<=ry;j++){const w=Math.round(rx*Math.sqrt(1-(j*j)/(ry*ry+.0001)));g.fillRect(Math.round(x-w),Math.round(y+j),w*2,1)}};
function mist(g,x0,x1,y,rt){for(let i=0;i<12;i++){const cx=x0+(x1-x0)*i/11+Math.sin(rt*1.3+i)*2,cy=y+Math.sin(rt*2+i*1.7)*1.5,r=6+((i*5)%4);g.globalAlpha=.5;ellp(g,cx,cy,r,3,'#cfe8ff');g.globalAlpha=.55;ellp(g,cx,cy-1,r*.65,2,'#fff');g.globalAlpha=.3;ellp(g,cx+2,cy+2,r*.8,2,'#e8d0ff')}g.globalAlpha=1}
function circle(g,cx,cy,rx,ry,rt){g.globalAlpha=.35;ellp(g,cx,cy,rx,ry,'#9ad0ff');g.globalAlpha=.55;ellp(g,cx,cy,rx-3,Math.max(1,ry-1),'#0a1a3a');g.globalAlpha=1;for(let i=0;i<16;i++){const a=rt*.8+i/16*6.283,x=cx+Math.cos(a)*(rx-1.5),y=cy+Math.sin(a)*(ry-.3);g.fillStyle=i%2?'#d8f0ff':'#ffd8f4';g.fillRect(Math.round(x),Math.round(y),1,1);if(i%3===0){g.fillStyle='#fff';g.fillRect(Math.round(x),Math.round(y)-1,1,1)}}}
function wisps(g,pts,rt){pts.forEach((p,i)=>{const y=p[1]+Math.sin(rt*3+i*1.3)*2.5,col=['#ffd0f0','#d0f0ff','#fff0b0'][i%3];g.globalAlpha=.25;ellp(g,p[0],y,4,4,col);g.globalAlpha=.9;ellp(g,p[0],y,1.5,1.5,'#fff');g.globalAlpha=1})}
/* 可愛精靈：大頭小身、粉色頭髮、透明翅膀、星星魔杖 */
function fairy(g,x,y,rt){const R=(c,a,b,w,h)=>{g.fillStyle=c;g.fillRect(Math.round(x+a),Math.round(y+b),w,h)};const bob=Math.round(Math.sin(rt*3)*1.5),fl=Math.sin(rt*30)>0?1:0;
 g.globalAlpha=.25;ellp(g,x,y+5+bob,9,9,'#ffd0f0');g.globalAlpha=.85;
 R('#d8f0ff',-7,1+bob-fl,4,5);R('#fff',-6,2+bob-fl,2,3);R('#d8f0ff',4,1+bob+fl,4,5);R('#fff',5,2+bob+fl,2,3);g.globalAlpha=1;
 R('#c0407a',-4,-4+bob,9,4);R('#ff7aa8',-5,-3+bob,2,7);R('#ff7aa8',4,-3+bob,2,7);R('#ff9ac0',-3,-4+bob,7,3);
 R('#ffe1d0',-3,-1+bob,7,5);R('#111',-2,1+bob,1,2);R('#111',2,1+bob,1,2);R('#ff9aa8',-3,3+bob,1,1);R('#ff9aa8',3,3+bob,1,1);R('#e0506a',0,3+bob,1,1);
 R('#ffb0d8',-2,4+bob,5,4);R('#fff',-2,4+bob,5,1);R('#ffe1d0',-1,8+bob,1,2);R('#ffe1d0',1,8+bob,1,2);
 g.strokeStyle='#ffd37a';g.lineWidth=1;g.beginPath();g.moveTo(x+4,y+6+bob);g.lineTo(x+9,y+1+bob);g.stroke();R('#fff3b0',8,-1+bob,3,3);R('#fff',9,0+bob,1,1);
 if(Math.sin(rt*5)>.3){R('#fff',12,-3+bob,1,1);R('#ffd0f0',-9,-5+bob,1,1)}}
function roofSide(R,bx,by){R('#1a1420',bx-4,by-1,52,3);R('#b3182f',bx-3,by,50,2);R('#e0102e',bx-1,by-3,46,3);R('#b3182f',bx+3,by-6,38,3);R('#e0102e',bx+9,by-8,26,2);R(GOLD,bx+20,by-11,4,3);R('#fff3b0',bx+21,by-12,2,1);
 for(let i=0;i<42;i+=4)R('#8a1226',bx+i,by-2,1,3);R(GOLD,bx-4,by+2,52,1);R(GOLD,bx-5,by-2,2,3);R(GOLD,bx+47,by-2,2,3)}
function drawSide(g,t,rt){
 const R=(c,a,b,w,h)=>{g.fillStyle=c;g.fillRect(Math.round(a),Math.round(b),w,h)};
 const hv=Math.round(Math.sin(rt*2.2)*1.5),base=FY-17+hv,bx=14,by=base-31;
 ellp(g,44,FY,28,3,'#0006');circle(g,44,FY-2,32,5,rt);mist(g,8,80,FY-8,rt);
 wisps(g,[[8,FY-14],[24,FY-9],[62,FY-9],[80,FY-14],[44,FY-6]],rt);
 const ih=base-by-6;
 R('#5a3a10',bx,base-3,48,4);R(GOLD,bx,base-3,48,1);
 roofSide(R,bx,by);
 R(GDK,bx+1,by+3,3,ih);R(GOLD,bx+1,by+3,1,ih);R(GDK,bx+42,by+3,3,ih);R(GOLD,bx+42,by+3,1,ih);
 R('#2a1030',bx+4,by+3,38,ih);
 g.save();g.beginPath();g.rect(bx+4,by+3,38,ih);g.clip();R('#3a1a44',bx+4,by+3,38,ih);
 seatSide(g,bx+17,base-6,Math.round(Math.sin(rt*3+1)*.5));g.restore();
 if(CURT==='silk'){R('#ff9ac0',bx+4,by+3,8,ih);R('#e0709a',bx+4,by+3,2,ih);R('#ff9ac0',bx+34,by+3,8,ih);R('#e0709a',bx+40,by+3,2,ih);R(GOLD,bx+4,by+13,8,2);R(GOLD,bx+34,by+13,8,2);R('#fff3b0',bx+11,by+13,1,2);R('#fff3b0',bx+34,by+13,1,2)}
 else{for(let i=0;i<38;i+=3){const sw=Math.round(Math.sin(rt*3+i)*.5);for(let j=0;j<ih;j+=2)R(j%4?'#fff':'#ffd0e8',bx+4+i+sw,by+4+j,1,1);R('#fff',bx+4+i+sw,by+3+ih-1,1,1)}}
 const lan=(x,y)=>{const s=Math.round(Math.sin(rt*3+x));R('#1a1420',x+s-1,y,5,6);R('#e0102e',x+s,y+1,3,4);R(GOLD,x+s+1,y+2,1,2);R('#ffe9a8',x+s,y-1,3,1)};
 lan(bx-5,by+3);lan(bx+46,by+3);
 fairy(g,72,by+8,rt);
 for(let i=0;i<14;i++){const tt=(rt*14+i*9)%46,x=12-tt*.4+(i%3),y=FY-22+((i*7)%16)+Math.sin(tt*.3+i)*2;R(i%2?'#fff':'#ffd0f0',x,y,1,1)}}
function drawFront(g,t,rt){
 const R=(c,a,b,w,h)=>{g.fillStyle=c;g.fillRect(Math.round(a),Math.round(b),w,h)};
 const hv=Math.round(Math.sin(rt*2.2)*1.5),base=FY-17+hv,bx=14,by=base-29;
 ellp(g,42,FY,28,3,'#0006');circle(g,42,FY-2,32,5,rt);mist(g,6,78,FY-8,rt);
 wisps(g,[[6,FY-14],[20,FY-8],[64,FY-8],[78,FY-14],[42,FY-6]],rt);
 const ih=base-by-6;
 R('#5a3a10',bx,base-3,44,4);R(GOLD,bx,base-3,44,1);
 R('#1a1420',bx-6,by-1,56,3);R('#b3182f',bx-5,by,54,2);R('#e0102e',bx-3,by-3,50,3);R('#b3182f',bx,by-6,44,3);R('#e0102e',bx+7,by-8,30,2);R(GOLD,bx+19,by-11,6,3);R('#fff3b0',bx+21,by-12,2,1);
 for(let i=0;i<48;i+=4)R('#8a1226',bx-2+i,by-2,1,3);R(GOLD,bx-6,by+2,56,1);R(GOLD,bx-7,by-2,2,4);R(GOLD,bx+49,by-2,2,4);
 R(GDK,bx+1,by+3,3,ih);R(GOLD,bx+1,by+3,1,ih);R(GDK,bx+40,by+3,3,ih);R(GOLD,bx+40,by+3,1,ih);
 R('#2a1030',bx+4,by+3,36,ih);R('#3a1a44',bx+4,by+3,36,ih);
 seatFront(g,bx+16,base-6,Math.round(Math.sin(rt*3+1)*.5));
 if(CURT==='silk'){R('#ff9ac0',bx+4,by+3,9,ih);R('#e0709a',bx+4,by+3,2,ih);R('#ff9ac0',bx+31,by+3,9,ih);R('#e0709a',bx+38,by+3,2,ih);R(GOLD,bx+4,by+13,9,2);R(GOLD,bx+31,by+13,9,2);R('#fff3b0',bx+12,by+13,1,2);R('#fff3b0',bx+31,by+13,1,2)}
 else{for(let i=0;i<36;i+=3){const sw=Math.round(Math.sin(rt*3+i)*.5);for(let j=0;j<ih;j+=2)R(j%4?'#fff':'#ffd0e8',bx+4+i+sw,by+4+j,1,1);R('#fff',bx+4+i+sw,by+3+ih-1,1,1)}}
 const lan=(x,y)=>{const s=Math.round(Math.sin(rt*3+x));R('#1a1420',x+s-1,y,5,6);R('#e0102e',x+s,y+1,3,4);R(GOLD,x+s+1,y+2,1,2);R('#ffe9a8',x+s,y-1,3,1)};
 lan(bx-8,by+3);lan(bx+50,by+3);
 fairy(g,70,by+10,rt);
 for(let i=0;i<14;i++){const tt=(rt*14+i*9)%50,x=8+((i*17+tt)%66),y=FY-26+((i*11)%22)+Math.sin(tt*.2+i)*2;R(i%2?'#fff':'#ffd0f0',x,y,1,1)}}
function bg(g){const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#1a2050');gr.addColorStop(1,'#10202a');g.fillStyle=gr;g.fillRect(0,0,W,H);g.fillStyle='#2a3a30';g.fillRect(0,FY,W,H-FY);g.fillStyle='#3a4a3a';g.fillRect(0,FY,W,1)}
const C=id=>document.getElementById(id);
const cvs={F:C('vF'),R:C('vR'),L:C('vL'),sF:C('sF'),sR:C('sR'),sN:C('sN')};
const t0=performance.now();
const loop=ts=>{const t=(ts-t0)/1000;
 for(const k of ['F','sF']){const g=ctx(cvs[k]);bg(g);drawFront(g,t,t)}
 {const g=ctx(cvs.R);bg(g);drawSide(g,t,t)}
 {const g=ctx(cvs.sR);bg(g);drawSide(g,t,t)}
 {const g=ctx(cvs.L);bg(g);g.save();g.translate(W,0);g.scale(-1,1);drawSide(g,t,t);g.restore()}
 {const g=ctx(cvs.sN);g.fillStyle='#10202a';g.fillRect(0,0,14,18);lunFront(g,1,2)}
 requestAnimationFrame(loop)};
requestAnimationFrame(loop);
document.querySelectorAll('input[name=c]').forEach(e=>e.onchange=()=>{CURT=document.querySelector('input[name=c]:checked').value});
C('cp').onclick=()=>{const v=(document.querySelector('input[name=p]:checked')||{}).value||'（還沒選）';const txt='倫妃步輦預覽 1127f：'+v+'　（簾子預設：'+(CURT==='silk'?'粉紅綢簾':'珍珠簾')+'）'+(C('note').value?'\n備註：'+C('note').value:'');
 C('out').textContent=txt;try{navigator.clipboard.writeText(txt).then(()=>{C('out').textContent='已複製：\n'+txt})}catch(e){}};
</script>
</body>
</html>
