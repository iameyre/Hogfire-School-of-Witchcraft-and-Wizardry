<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>倫生・選字體</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cactus+Classical+Serif&family=Noto+Serif+TC:wght@400;700;900&family=Noto+Sans+TC:wght@400;700;900&family=LXGW+WenKai+TC:wght@400;700&family=Chiron+Sung+HK:wght@400;700;900&family=Chiron+Hei+HK:wght@400;700;900&family=Huninn&family=Iansui&family=DotGothic16&family=Shippori+Mincho:wght@400;700&family=Zen+Old+Mincho:wght@400;700&family=Kaisei+Tokumin:wght@400;700&family=Cinzel:wght@700&family=Oswald:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#07060a;--card:#120c14;--line:#ffffff1f;--red:#e0102e;--silver:#d9dde6;--gold:#ffd56a;--dim:#9a9da6}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:#f2f2f4;-webkit-text-size-adjust:100%}
body{font:16px/1.7 "Noto Sans TC",system-ui,sans-serif;padding:16px 16px calc(120px + env(safe-area-inset-bottom))}
h1{font:700 20px/1.3 "Cinzel","Noto Serif TC",serif;letter-spacing:.3em;margin:6px 0 4px;color:var(--silver)}
.sub{color:var(--dim);font-size:13px;margin:0 0 14px}
.card{background:linear-gradient(180deg,#1a1020,#0c0810);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 12px}
.card.t{border-color:var(--red);box-shadow:0 0 0 1px #e0102e55,0 0 14px #e0102e33}
.card.b{border-left:3px solid var(--gold)}
.hd{display:flex;justify-content:space-between;align-items:center;font:13px "Noto Sans TC";color:var(--dim)}
.hd b{color:var(--gold);font-weight:700}
.s1{font-size:36px;line-height:1.3;margin:6px 0 2px;color:#fff;letter-spacing:.08em}
.s2{font-size:16px;color:var(--gold);margin:0}
.s3{font-size:14px;line-height:1.7;color:#cfd2d8;margin:4px 0 0}
.s4{font-size:18px;color:var(--silver);margin:2px 0 0;letter-spacing:.06em}
.btns{display:flex;gap:8px;margin-top:10px}
.btns button{flex:1;padding:10px 0;border-radius:8px;border:1px solid #ffffff33;background:#ffffff0a;color:#ddd;font:700 14px "Noto Sans TC"}
.btns button.on{border-color:var(--red);background:#e0102e33;color:#fff}
.btns button.on.bb{border-color:var(--gold);background:#ffd56a22}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:#050407f2;border-top:1px solid var(--line);z-index:5}
.bar div{font-size:14px;margin-bottom:8px}
.bar button{width:100%;padding:12px;border-radius:10px;border:1px solid var(--red);background:linear-gradient(180deg,#e0102e55,#e0102e11);color:#fff;font:700 15px "Noto Sans TC"}
.note{font-size:12px;color:var(--dim);margin:0 0 12px}
</style>
</head>
<body>
<h1>FONT PICK</h1>
<p class="sub">每個字體下面有兩顆按鈕：「標題用」會套在大標題，「內文用」會套在小字、說明和按鈕。可以選同一個。最後按下方「複製我的選擇」貼給我。</p>
<p class="note">方向：奧術（Arcane）的古典金屬感＋K/DA FIRESTARTER 的黑底紅銀。日系字體有少數字形和繁中略有不同，介意的話選繁中字體。</p>
<div id="list"></div>
<div class="bar"><div id="sum">還沒選</div><button id="copy">複製我的選擇</button></div>
<script>
const F=[
 [1,'Cactus Classical Serif（目前使用）','"Cactus Classical Serif","Noto Serif TC",serif',400],
 [2,'Noto Serif TC 特粗宋體（奧術古典）','"Noto Serif TC",serif',900],
 [3,'Noto Sans TC 特粗黑體（FIRESTARTER 感）','"Noto Sans TC",sans-serif',900],
 [4,'霞鶩文楷（手寫楷書）','"LXGW WenKai TC",serif',700],
 [5,'Shippori Mincho 日系明朝','"Shippori Mincho",serif',700],
 [6,'Chiron Sung HK 宋體','"Chiron Sung HK",serif',500],
 [7,'粉圓 Huninn（圓體）','"Huninn",sans-serif',400],
 [8,'芫荽 Iansui（手寫風）','"Iansui",serif',400],
 [9,'DotGothic16（像素點陣）','"DotGothic16",sans-serif',400]
];
let T=null,B=null;try{const s=JSON.parse(localStorage.getItem('lunfont')||'{}');T=s.t||null;B=s.b||null}catch(e){}
const L=document.getElementById('list');
F.forEach(([n,name,fam,w])=>{const c=document.createElement('div');c.className='card';c.dataset.n=n;
 c.innerHTML=`<div class="hd"><span><b>${n}</b>　${name}</span></div>
 <div class="smp">
 <p class="s1">倫生・幹話龍鳳</p>
 <p class="s2">G2 打怪　12/4～12/6</p>
 <p class="s3">擊敗怪物 40 隻，打倒倫倫村的倫凍王。領取獎勵（倫性 15、倫幣 200）。進度看玩了幾天，不看日期，漏玩不會被丟下。</p>
 <p class="s4">7/30　0/1　LV 30　1234</p></div>
 <div class="btns"><button data-r="t">標題用這個</button><button data-r="b" class="bb">內文用這個</button></div>`;const sm=c.querySelector(".smp");sm.style.fontFamily=fam;sm.style.fontWeight=w;L.appendChild(c)});
const nm=n=>{const f=F.find(x=>x[0]===n);return f?n+' '+f[1].split('（')[0]:'未選'};
const upd=()=>{document.querySelectorAll('.card').forEach(c=>{const n=+c.dataset.n;c.classList.toggle('t',n===T);c.classList.toggle('b',n===B);c.querySelector('[data-r=t]').classList.toggle('on',n===T);c.querySelector('[data-r=b]').classList.toggle('on',n===B);c.querySelector('[data-r=b]').classList.toggle('bb',true)});
 document.getElementById('sum').textContent='標題：'+nm(T)+'　內文：'+nm(B);try{localStorage.setItem('lunfont',JSON.stringify({t:T,b:B}))}catch(e){}};
L.addEventListener('click',e=>{const b=e.target.closest('button[data-r]');if(!b)return;const n=+b.closest('.card').dataset.n;if(b.dataset.r==='t')T=n;else B=n;upd()});
document.getElementById('copy').onclick=async()=>{const t='字體選擇：標題 '+nm(T)+'；內文 '+nm(B);let ok=false;try{await navigator.clipboard.writeText(t);ok=true}catch(e){}document.getElementById('copy').textContent=ok?'已複製，貼給我':t;};
upd();
</script>
</body>
</html>
